[package]
name = "ama10"
version = "0.2.2"
description = "AMa10 SDK（Wuling SDK Rust）"
publish.workspace = true
edition.workspace = true
# Hand-written Rust here is MIT (Kal'tsit·Esperanta authors). The OpenAPI spec
# bundled in `api/wuling-openapi.yaml` and the `progenitor`-generated code in
# `src/wuling_api/generated.rs` are derived from Wuling DevOps (Apache-2.0); see
# `api/LICENSE-APACHE` and `api/NOTICE` for the upstream attribution required
# by section 4 of the Apache License.
license = "MIT AND Apache-2.0"

[lib]
path = "src/ama10.rs"

[[bin]]
name = "ama10"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
credentials_provider.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
progenitor-client.workspace = true
# NOTE: deliberately NOT inheriting the workspace `reqwest` alias. The
# workspace ships `zed-reqwest` (a fork of reqwest) under the `reqwest` name,
# but `progenitor-client` is built against upstream `reqwest 0.13` from
# crates.io, and the two `Request`/`Error`/`HeaderValue` types are distinct.
# Pulling in stock reqwest here keeps the generated client self-consistent;
# the auth client in `src/auth.rs` uses the same stock reqwest so request
# types match between the OpenAPI client and the OAuth flow code.
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
# `reqwest 0.13`'s send path uses `tokio::time::sleep` for its request timeout,
# which panics when polled outside a Tokio runtime. We hold a `runtime::Handle`
# in `WulingClient` and route each HTTP request through `handle.spawn(...)` so
# the work runs on the workspace `gpui_tokio` runtime.
tokio = { workspace = true, features = ["rt"] }
url.workspace = true
uuid.workspace = true

[lints]
workspace = true
