[package]
name = "ama10"
version = "0.2.2"
description = "AMa10 SDK（Wuling SDK Rust）"
publish.workspace = true
edition.workspace = true
# Hand-written Rust here is MIT (Kal'tsit·Esperanta authors). The OpenAPI spec
# bundled in `api/wuling-openapi.yaml` and the generated type projection in
# `api/wuling-client-types.json` are derived from Wuling DevOps (Apache-2.0); see
# `api/LICENSE-APACHE` and `api/NOTICE` for the upstream attribution required
# by section 4 of the Apache License.
license = "MIT AND Apache-2.0"

[lib]
path = "src/ama10.rs"

[[bin]]
name = "ama10"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
credentials_provider.workspace = true
gpui.workspace = true
# The workspace's `reqwest` name points to `zed-reqwest`. This crate uses
# upstream reqwest because its small serde clients run on the Tokio runtime.
reqwest = { version = "0.13", features = ["form", "json"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
strum.workspace = true
# `reqwest 0.13`'s send path uses `tokio::time::sleep` for its request timeout,
# which panics when polled outside a Tokio runtime. We hold a `runtime::Handle`
# in `WulingClient` and route each HTTP request through `handle.spawn(...)` so
# the work runs on the workspace `gpui_tokio` runtime.
tokio = { workspace = true, features = ["rt"] }
typify.workspace = true
url.workspace = true
percent-encoding.workspace = true

[lints]
workspace = true
